name: Phase 1F-B.1 Cleanup

on:
  pull_request:
    paths:
      - '.github/workflows/phase1fb1-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Remove temporary verification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/phase1fb1-correction.yml
          git rm -f scripts/phase1fb1_*
          git commit -m "Remove temporary Phase 1F-B.1 verification files"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
