name: Recruiter Business Starter public-only staging verification

on:
  pull_request:
    paths:
      - 'src/pages/Recruiters.tsx'
      - 'src/components/landing/RecruiterLanding.tsx'
      - 'src/pages/recruiter/RecruiterGuide.tsx'
      - 'src/components/opportunities/recruiter/RecruiterAccessPage.tsx'
      - 'src/test/recruiterBusinessStarterCopyParity.test.ts'
      - 'tests/e2e/recruiter-business-starter-public.spec.ts'
      - 'src/pages/Pricing.tsx'
      - 'src/lib/agencyPlans.ts'
      - 'tests/e2e/pricing-role-public-mobile.spec.ts'
      - '.github/workflows/recruiter-business-starter-stage.yml'

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:65432
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-staging-only
      VITE_SUPABASE_PROJECT_ID: isolated-stage-only
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Typecheck app and build config
        run: |
          bunx tsc -p tsconfig.app.json --noEmit
          bunx tsc -p tsconfig.node.json --noEmit
      - name: Recruiter source parity and isolated role/eligibility regression
        run: >-
          bunx vitest run
          src/test/recruiterBusinessStarterCopyParity.test.ts
          src/test/phase1pA1RecruiterEligibilityCompanyType.test.ts
          src/test/phase1jBWorkspaceRouting.test.tsx
          src/test/phase1jB2ARecruiterEntry.test.tsx
          src/test/phase1jC2RecruiterCopyReconciliation.test.tsx
          src/test/phase1fa22R1aRenderedTrustState.test.tsx
      - name: Build frontend with isolated dummy backend
        run: bun run build
      - name: Install headless browser
        run: bunx playwright install --with-deps chromium
      - name: Run public recruiter and pricing 320/375px mobile smoke tests
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/htp-recruiter-stage-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/recruiters > /dev/null; then break; fi
            sleep 1
          done
          bunx playwright test tests/e2e/recruiter-business-starter-public.spec.ts tests/e2e/pricing-role-public-mobile.spec.ts --project=desktop
      - name: Upload browser screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-business-starter-public-mobile-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
