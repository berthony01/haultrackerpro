name: Verify F2-B-R1

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: non-production-test-key
      VITE_SUPABASE_PROJECT_ID: example
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused F2-B-R1 tests
        run: bunx vitest run src/test/phase1nF2DocsLegalFoundation.test.ts --reporter=verbose

      - name: Native TypeScript check
        run: bunx --package @typescript/native-preview tsgo --noEmit

      - name: Production build
        run: bun run build

      - name: Default full test suite
        run: bunx vitest run

      - name: Forbidden marker scan
        run: |
          if grep -nE '\.only|\.skip|\.todo|xit\(|xdescribe\(' src/test/phase1nF2DocsLegalFoundation.test.ts; then
            echo 'Forbidden test marker found'
            exit 1
          fi

      - name: Exact phase scope
        run: |
          expected=$(printf '%s\n' \
            src/App.tsx \
            src/lib/docs/docsRegistry.ts \
            src/lib/legal/policyRegistry.ts \
            src/pages/Docs.tsx \
            src/pages/LegalCenter.tsx \
            src/test/phase1nF2DocsLegalFoundation.test.ts | sort)
          actual=$(git diff --name-only 3926bec94121cfca616a56e006d2a952e654a338...HEAD -- ':!.github/workflows/verify-f2b-r1.yml' | sort)
          test "$actual" = "$expected"
