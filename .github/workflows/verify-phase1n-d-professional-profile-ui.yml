name: Verification Only - Phase 1N-D Professional Profile UI

on:
  pull_request:
    branches:
      - verify/phase1n-d-ui-base
    paths:
      - '.github/workflows/verify-phase1n-d-professional-profile-ui.yml'

permissions:
  contents: write

jobs:
  phase1n-professional-profile-ui:
    name: Exact test repair and complete acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dedicated test-fix branch
        uses: actions/checkout@v4
        with:
          ref: phase1n-d-test-fix
          fetch-depth: 0
          persist-credentials: true

      - name: Apply four exact assertion repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/test/phase1nProfessionalProfileFoundation.test.tsx')
          text = path.read_text()
          replacements = [
              ("      'Display name',", "      /^Display name/ ,", 1),
              (
                  "screen.getByLabelText('Display name')",
                  "screen.getByLabelText(/^Display name/)",
                  2,
              ),
              (
                  "expect(hook).not.toContain('_display_name: input.display_name');",
                  "expect(hook).not.toContain('\\n          _display_name:');",
                  1,
              ),
          ]

          for old, new, expected_count in replacements:
              actual_count = text.count(old)
              if actual_count != expected_count:
                  raise SystemExit(
                      f'Exact replacement guard failed for {old!r}: '
                      f'expected {expected_count}, found {actual_count}'
                  )
              text = text.replace(old, new)

          path.write_text(text)
          PY

          test "$(git diff --name-only)" = "src/test/phase1nProfessionalProfileFoundation.test.tsx"
          git diff --check

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run complete acceptance matrix and preserve logs
        id: matrix
        run: |
          mkdir -p artifacts
          set +e

          bunx vitest run src/test/phase1nProfessionalProfileFoundation.test.tsx \
            --reporter verbose 2>&1 | tee artifacts/target.log
          TARGET=${PIPESTATUS[0]}

          bunx vitest run \
            src/test/assistantAgencyAccessIntegrity.test.ts \
            src/test/agencySeparation.test.tsx \
            src/test/phase3AgencyWorkflow.test.ts \
            src/test/phase4aDriverControlCenter.test.ts \
            --reporter verbose 2>&1 | tee artifacts/adjacent.log
          ADJACENT=${PIPESTATUS[0]}

          bunx tsgo --noEmit 2>&1 | tee artifacts/typecheck.log
          TYPECHECK=${PIPESTATUS[0]}

          bunx vitest run 2>&1 | tee artifacts/full-suite.log
          FULL=${PIPESTATUS[0]}

          bun run build 2>&1 | tee artifacts/build.log
          BUILD=${PIPESTATUS[0]}

          git diff --check 2>&1 | tee artifacts/diff-check.log
          DIFF=${PIPESTATUS[0]}

          {
            echo "target=${TARGET}"
            echo "adjacent=${ADJACENT}"
            echo "typecheck=${TYPECHECK}"
            echo "full=${FULL}"
            echo "build=${BUILD}"
            echo "diff=${DIFF}"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1n-professional-profile-complete-gate
          path: artifacts

      - name: Enforce every acceptance result and one-file scope
        run: |
          set -eu
          test "${{ steps.matrix.outputs.target }}" = "0"
          test "${{ steps.matrix.outputs.adjacent }}" = "0"
          test "${{ steps.matrix.outputs.typecheck }}" = "0"
          test "${{ steps.matrix.outputs.full }}" = "0"
          test "${{ steps.matrix.outputs.build }}" = "0"
          test "${{ steps.matrix.outputs.diff }}" = "0"
          test "$(git diff --name-only)" = "src/test/phase1nProfessionalProfileFoundation.test.tsx"
          git diff --check

      - name: Commit verified one-file test repair
        run: |
          git config user.name "ChatGPT Supervised Verification"
          git config user.email "chatgpt-supervised@openai"
          git add src/test/phase1nProfessionalProfileFoundation.test.tsx
          git commit -m "Phase 1N-D-R5: repair professional profile assertions"
          git push origin HEAD:phase1n-d-test-fix
