name: Verification Only - Phase 1N-F1-E-R2 Final

on:
  pull_request:
    paths:
      - '.github/workflows/verify-phase1n-f1e-r2-final.yml'
  workflow_dispatch:

jobs:
  final-verification:
    name: Final focused, native typecheck, build, and full suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: verification-only-anon-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused account-deletion and Phase 1H tests
        run: |
          bunx vitest run \
            src/test/phase1aDriverBillingResolution.test.ts \
            src/test/phase1aDriverBillingPure.test.ts \
            src/test/securityViewsShape.test.ts \
            src/test/phase1hA1FoundationRuntime.test.ts \
            --reporter verbose

      - name: Native TypeScript typecheck
        run: bunx --package @typescript/native-preview tsgo --noEmit

      - name: Build
        run: bun run build

      - name: Default full Vitest suite
        run: bunx vitest run
