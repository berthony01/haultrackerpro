# Temporary CI trigger: validate the accepted Phase 1J foundation and B2A
# recruiter-entry route on real PostgreSQL 16. This branch is verification-only.
name: Phase 1J — Postgres 16 and Recruiter Entry Gate

on:
  push:
    paths:
      - '.github/workflows/phase1j-capabilities-postgres.yml'
      - 'tests/postgres/phase1jAdditiveCapabilitiesPostgres.test.ts'
      - 'src/test/phase1jAdditiveCapabilities.test.ts'
      - 'src/test/phase1jBWorkspaceRouting.test.tsx'
      - 'src/test/phase1jB2ARecruiterEntry.test.tsx'
      - 'vitest.phase1j-capabilities-postgres.config.ts'
      - 'supabase/migration-candidates/20260720110000_phase1j_additive_user_capabilities.sql'
      - 'src/lib/userCapabilities.ts'
      - 'src/lib/workspaceAccess.ts'
      - 'src/hooks/useUserCapabilities.ts'
      - 'src/hooks/useViewMode.ts'
      - 'src/components/opportunities/recruiter/RecruiterEntryRoute.tsx'
      - 'src/App.tsx'
  pull_request:
    paths:
      - '.github/workflows/phase1j-capabilities-postgres.yml'
      - 'tests/postgres/phase1jAdditiveCapabilitiesPostgres.test.ts'
      - 'src/test/phase1jAdditiveCapabilities.test.ts'
      - 'src/test/phase1jBWorkspaceRouting.test.tsx'
      - 'src/test/phase1jB2ARecruiterEntry.test.tsx'
      - 'vitest.phase1j-capabilities-postgres.config.ts'
      - 'supabase/migration-candidates/20260720110000_phase1j_additive_user_capabilities.sql'
      - 'src/lib/userCapabilities.ts'
      - 'src/lib/workspaceAccess.ts'
      - 'src/hooks/useUserCapabilities.ts'
      - 'src/hooks/useViewMode.ts'
      - 'src/components/opportunities/recruiter/RecruiterEntryRoute.tsx'
      - 'src/App.tsx'
  workflow_dispatch:

jobs:
  phase1j-capabilities-postgres:
    name: Real Postgres 16 — Phase 1J A/B1/B2A
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1j_caps
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1j_caps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PHASE1J_CAPABILITIES_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1j_caps
      PHASE1J_CAPABILITIES_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Hard-fail if database URL missing
        run: |
          if [ -z "$PHASE1J_CAPABILITIES_DATABASE_URL" ]; then
            echo "PHASE1J_CAPABILITIES_DATABASE_URL is required"; exit 1
          fi
          echo "database URL present"

      - name: Forbidden-marker scan (no only / skip / todo)
        run: |
          if grep -nE '\.only\(|\.skip\(|\.todo\(|xit\(|xdescribe\(' \
              tests/postgres/phase1jAdditiveCapabilitiesPostgres.test.ts \
              src/test/phase1jAdditiveCapabilities.test.ts \
              src/test/phase1jBWorkspaceRouting.test.tsx \
              src/test/phase1jB2ARecruiterEntry.test.tsx; then
            echo "Forbidden Vitest marker found in Phase 1J tests."; exit 1
          fi
          echo "clean"

      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready"; exit 1

      - name: Run Phase 1J-A real-Postgres 16 gate
        id: pg_gate
        run: |
          set -o pipefail
          mkdir -p artifacts
          bunx vitest run --config vitest.phase1j-capabilities-postgres.config.ts --reporter=verbose 2>&1 | tee artifacts/phase1j-capabilities-postgres.log
        continue-on-error: true

      - name: Upload PG16 gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1j-b2a-postgres-log
          path: artifacts/phase1j-capabilities-postgres.log

      - name: Enforce PG16 gate result
        if: steps.pg_gate.outcome != 'success'
        run: |
          echo "Phase 1J real-Postgres 16 gate failed. See uploaded log."
          exit 1

      - name: Run Phase 1J-A PGlite focused suite
        run: bunx vitest run src/test/phase1jAdditiveCapabilities.test.ts

      - name: Run Phase 1J-B1 workspace routing suite
        run: bunx vitest run src/test/phase1jBWorkspaceRouting.test.tsx

      - name: Run Phase 1J-B2A recruiter entry suite
        run: bunx vitest run src/test/phase1jB2ARecruiterEntry.test.tsx

      - name: Typecheck (node)
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Typecheck (app)
        run: bunx tsc -p tsconfig.app.json --noEmit
