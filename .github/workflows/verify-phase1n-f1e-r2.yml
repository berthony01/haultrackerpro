name: Verification Only - Phase 1N-F1-E-R2

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/account-deletion.ts'
      - 'supabase/functions/delete-account/index.ts'
      - 'src/test/phase1aDriverBillingResolution.test.ts'
      - 'src/integrations/supabase/types.ts'
      - '.github/workflows/verify-phase1n-f1e-r2.yml'
  workflow_dispatch:

jobs:
  verify-phase1n-f1e-r2:
    name: Focused, Phase 1H, typecheck, build, full suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Focused account-deletion and related tests
        run: |
          bunx vitest run \
            src/test/phase1aDriverBillingResolution.test.ts \
            src/test/phase1aDriverBillingPure.test.ts \
            src/test/securityViewsShape.test.ts \
            src/test/phase1hA1FoundationRuntime.test.ts \
            --reporter verbose

      - name: Typecheck
        run: bunx tsgo --noEmit

      - name: Build
        run: bun run build

      - name: Default full Vitest suite
        run: bunx vitest run
