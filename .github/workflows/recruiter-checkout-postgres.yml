name: Recruiter Checkout — Postgres 16 Concurrency Gate

on:
  pull_request:
    paths:
      - '.github/workflows/recruiter-checkout-postgres.yml'
      - 'tests/postgres/recruiterCheckoutConcurrency.test.ts'
      - 'vitest.recruiter-checkout-postgres.config.ts'
      - 'supabase/migration-candidates/20260717235300_phase1g_r1a1_recruiter_checkout_intents.sql'
      - 'supabase/functions/_shared/recruiter-checkout.ts'
      - 'supabase/functions/create-recruiter-checkout/index.ts'
      - 'src/test/phase1gR1A2RecruiterCheckoutOrchestrator.test.ts'
  workflow_dispatch:

jobs:
  recruiter-checkout-postgres:
    name: Real Postgres 16 — Recruiter Checkout Atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruiter_checkout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recruiter_checkout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RECRUITER_CHECKOUT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recruiter_checkout
      VITE_SUPABASE_URL: https://phase1g-r1a3-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: phase1g-r1a3-isolated-test-key

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from frozen lockfile
        run: bun install --frozen-lockfile

      - name: Confirm PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if bun -e 'import pg from "pg"; const c=new pg.Client({connectionString:process.env.RECRUITER_CHECKOUT_DATABASE_URL}); await c.connect(); await c.end();'; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run real-PostgreSQL Recruiter Checkout suite
        id: postgres_suite
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run --config vitest.recruiter-checkout-postgres.config.ts --reporter=verbose 2>&1 | tee recruiter-checkout-postgres.log

      - name: Upload PostgreSQL suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-checkout-postgres-log
          path: recruiter-checkout-postgres.log
          if-no-files-found: error

      - name: Enforce PostgreSQL suite result
        if: steps.postgres_suite.outcome != 'success'
        run: exit 1

      - name: Run focused Recruiter Checkout orchestrator suite
        run: bunx vitest run src/test/phase1gR1A2RecruiterCheckoutOrchestrator.test.ts

      - name: Typecheck application
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Node configuration
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Run DEF-04 identity validation
        run: bunx vitest run src/test/phase1cWebhookIdentityValidator.test.ts

      - name: Run DEF-23 webhook idempotency
        run: bunx vitest run src/test/phase1cWebhookIdempotencyRetry.test.ts src/test/phase1c2WebhookIdempotencyStateMachine.test.ts

      - name: Run full normal test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          HTP_BUILD_SHA: ${{ github.sha }}


      - name: Verify build version manifest and meta
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const versionPath = path.join('dist', 'version.json');
          if (!fs.existsSync(versionPath)) {
            console.error('dist/version.json missing');
            process.exit(1);
          }
          const raw = fs.readFileSync(versionPath, 'utf8');
          const parsed = JSON.parse(raw);

          const keys = Object.keys(parsed).sort();
          if (JSON.stringify(keys) !== JSON.stringify(['app', 'builtAt', 'sha'])) {
            console.error('unexpected version.json keys:', keys);
            process.exit(1);
          }
          if (parsed.app !== 'haultrackerpro') {
            console.error('bad app:', parsed.app);
            process.exit(1);
          }
          if (!/^[0-9a-f]{40}$/i.test(parsed.sha)) {
            console.error('bad sha shape:', parsed.sha);
            process.exit(1);
          }
          const expected = (process.env.GITHUB_SHA || '').toLowerCase();
          if (parsed.sha.toLowerCase() !== expected) {
            console.error('sha mismatch. json:', parsed.sha, 'expected:', expected);
            process.exit(1);
          }
          if (Number.isNaN(new Date(parsed.builtAt).getTime())) {
            console.error('bad builtAt:', parsed.builtAt);
            process.exit(1);
          }

          const indexHtml = fs.readFileSync(path.join('dist', 'index.html'), 'utf8');
          const matches = indexHtml.match(/<meta\s+name="htp-build-sha"\s+content="([^"]+)"\s*\/?\s*>/g) || [];
          if (matches.length !== 1) {
            console.error('expected exactly one htp-build-sha meta tag, got', matches.length);
            process.exit(1);
          }
          const metaSha = matches[0].match(/content="([^"]+)"/)[1];
          if (metaSha.toLowerCase() !== expected) {
            console.error('meta sha mismatch. meta:', metaSha, 'expected:', expected);
            process.exit(1);
          }

          console.log('version.json OK; sha=' + parsed.sha + ' builtAt=' + parsed.builtAt);
          NODE
        env:
          HTP_BUILD_SHA: ${{ github.sha }}

