name: Recruiter Checkout — Postgres 16 Concurrency Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recruiter-checkout-postgres.yml'
      - 'tests/postgres/recruiterCheckoutConcurrency.test.ts'
      - 'vitest.recruiter-checkout-postgres.config.ts'
      - 'supabase/migration-candidates/20260717235300_phase1g_r1a1_recruiter_checkout_intents.sql'
      - 'supabase/migrations/20260730060000_phase1r_d2_b1_recruiter_checkout_intents.sql'
      - 'src/test/phase1rD2B1RecruiterCheckoutIntentMigrationPromotion.test.ts'
      - 'supabase/migration-candidates/20260730070000_phase1r_d2_b2_business_checkout_claims.sql'
      - 'supabase/migrations/20260730070000_phase1r_d2_b2_business_checkout_claims.sql'
      - 'src/test/phase1rD2B2BusinessCheckoutClaimCandidateContract.test.ts'
      - 'src/test/phase1rD2B2BusinessCheckoutClaimMigrationPromotion.test.ts'
      - 'tests/postgres/businessCheckoutClaimsConcurrency.test.ts'
      - 'vitest.business-checkout-postgres.config.ts'
      - 'supabase/functions/_shared/business-checkout-claim.ts'
      - 'src/test/phase1rD2B3BusinessCheckoutIntegration.test.ts'
      - 'supabase/functions/_shared/recruiter-checkout.ts'
      - 'supabase/functions/create-recruiter-checkout/index.ts'
      - 'supabase/functions/create-agency-checkout/index.ts'
      - 'src/test/phase1gR1A2RecruiterCheckoutOrchestrator.test.ts'
      - 'src/components/opportunities/RecruiterBillingPanel.tsx'
      - 'src/test/phase1gR1A4BuildShaAndCopy.test.ts'
      - 'src/test/phase1gR1A4BillingCopyRendered.test.tsx'
      - 'src/test/phase1gR1A7RecruiterBillingFlow.test.tsx'
      - 'src/hooks/opportunities/useRecruiterBilling.ts'
      - 'src/lib/opportunities/recruiterCheckoutMessages.ts'
      - 'src/lib/opportunities/recruiterBillingState.ts'
      - 'src/index.css'
      - 'tests/e2e/recruiter-billing.spec.ts'
      - 'playwright.recruiter-billing.config.ts'
      - 'package.json'
      - 'bun.lockb'
      - 'vite/htpBuildShaPlugin.ts'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/recruiter-checkout-postgres.yml'
      - 'tests/postgres/recruiterCheckoutConcurrency.test.ts'
      - 'vitest.recruiter-checkout-postgres.config.ts'
      - 'supabase/migration-candidates/20260717235300_phase1g_r1a1_recruiter_checkout_intents.sql'
      - 'supabase/migrations/20260730060000_phase1r_d2_b1_recruiter_checkout_intents.sql'
      - 'src/test/phase1rD2B1RecruiterCheckoutIntentMigrationPromotion.test.ts'
      - 'supabase/migration-candidates/20260730070000_phase1r_d2_b2_business_checkout_claims.sql'
      - 'supabase/migrations/20260730070000_phase1r_d2_b2_business_checkout_claims.sql'
      - 'src/test/phase1rD2B2BusinessCheckoutClaimCandidateContract.test.ts'
      - 'src/test/phase1rD2B2BusinessCheckoutClaimMigrationPromotion.test.ts'

      - 'tests/postgres/businessCheckoutClaimsConcurrency.test.ts'
      - 'vitest.business-checkout-postgres.config.ts'
      - 'supabase/functions/_shared/business-checkout-claim.ts'
      - 'src/test/phase1rD2B3BusinessCheckoutIntegration.test.ts'
      - 'supabase/functions/_shared/recruiter-checkout.ts'
      - 'supabase/functions/_shared/agency-checkout.ts'
      - 'supabase/functions/create-recruiter-checkout/index.ts'
      - 'supabase/functions/create-agency-checkout/index.ts'
      - 'src/test/phase1gR1A2RecruiterCheckoutOrchestrator.test.ts'
      - 'src/components/opportunities/RecruiterBillingPanel.tsx'
      - 'src/test/phase1gR1A4BuildShaAndCopy.test.ts'
      - 'src/test/phase1gR1A4BillingCopyRendered.test.tsx'
      - 'src/test/phase1gR1A7RecruiterBillingFlow.test.tsx'
      - 'src/hooks/opportunities/useRecruiterBilling.ts'
      - 'src/lib/opportunities/recruiterCheckoutMessages.ts'
      - 'src/lib/opportunities/recruiterBillingState.ts'
      - 'src/index.css'
      - 'tests/e2e/recruiter-billing.spec.ts'
      - 'playwright.recruiter-billing.config.ts'
      - 'package.json'
      - 'bun.lockb'
      - 'vite/htpBuildShaPlugin.ts'
      - 'vite.config.ts'
  workflow_dispatch:

jobs:
  recruiter-checkout-postgres:
    name: Real Postgres 16 — Recruiter Checkout Atomicity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recruiter_checkout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recruiter_checkout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RECRUITER_CHECKOUT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recruiter_checkout
      BUSINESS_CHECKOUT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recruiter_checkout
      VITE_SUPABASE_URL: https://phase1g-r1a4-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: phase1g-r1a4-isolated-test-key

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies from frozen lockfile
        run: bun install --frozen-lockfile

      - name: Confirm PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if bun -e 'import pg from "pg"; const c=new pg.Client({connectionString:process.env.RECRUITER_CHECKOUT_DATABASE_URL}); await c.connect(); await c.end();'; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Run real-PostgreSQL Recruiter Checkout suite
        id: postgres_suite
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run --config vitest.recruiter-checkout-postgres.config.ts --reporter=verbose 2>&1 | tee recruiter-checkout-postgres.log

      - name: Upload PostgreSQL suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-checkout-postgres-log
          path: recruiter-checkout-postgres.log
          if-no-files-found: error

      - name: Enforce PostgreSQL suite result
        if: steps.postgres_suite.outcome != 'success'
        run: exit 1

      - name: Run real-PostgreSQL Business Checkout Claim suite
        id: business_checkout_postgres_suite
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run --config vitest.business-checkout-postgres.config.ts --reporter=verbose 2>&1 | tee business-checkout-postgres.log

      - name: Upload Business Checkout PostgreSQL suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-checkout-postgres-log
          path: business-checkout-postgres.log
          if-no-files-found: error

      - name: Enforce Business Checkout PostgreSQL suite result
        if: steps.business_checkout_postgres_suite.outcome != 'success'
        run: exit 1



      - name: Run focused Recruiter Checkout orchestrator suite
        run: bunx vitest run src/test/phase1gR1A2RecruiterCheckoutOrchestrator.test.ts

      - name: Run focused A4 copy and build-version suites
        run: bunx vitest run src/test/phase1gR1A4BuildShaAndCopy.test.ts src/test/phase1gR1A4BillingCopyRendered.test.tsx

      - name: Typecheck application
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck Node configuration
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Run DEF-04 identity validation
        run: bunx vitest run src/test/phase1cWebhookIdentityValidator.test.ts

      - name: Run DEF-23 webhook idempotency
        run: bunx vitest run src/test/phase1cWebhookIdempotencyRetry.test.ts src/test/phase1c2WebhookIdempotencyStateMachine.test.ts

      - name: Run full normal test suite
        run: bunx vitest run

      - name: Build production application
        run: bun run build
        env:
          HTP_BUILD_SHA: ${{ github.sha }}

      - name: Verify build version manifest and meta
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const versionPath = path.join('dist', 'version.json');
          if (!fs.existsSync(versionPath)) throw new Error('dist/version.json missing');

          const raw = fs.readFileSync(versionPath, 'utf8');
          const parsed = JSON.parse(raw);
          const keys = Object.keys(parsed).sort();
          if (JSON.stringify(keys) !== JSON.stringify(['app', 'builtAt', 'sha'])) {
            throw new Error(`unexpected version.json keys: ${keys.join(',')}`);
          }
          if (parsed.app !== 'haultrackerpro') throw new Error(`bad app: ${parsed.app}`);
          if (!/^[0-9a-f]{40}$/i.test(parsed.sha)) throw new Error(`bad sha shape: ${parsed.sha}`);

          const expected = (process.env.GITHUB_SHA || '').toLowerCase();
          if (parsed.sha.toLowerCase() !== expected) {
            throw new Error(`sha mismatch: ${parsed.sha} != ${expected}`);
          }
          if (new Date(parsed.builtAt).toISOString() !== parsed.builtAt) {
            throw new Error(`bad builtAt: ${parsed.builtAt}`);
          }

          const indexHtml = fs.readFileSync(path.join('dist', 'index.html'), 'utf8');
          const matches = indexHtml.match(/<meta\s+name="htp-build-sha"\s+content="([^"]+)"\s*\/?\s*>/g) || [];
          if (matches.length !== 1) {
            throw new Error(`expected one htp-build-sha meta tag, got ${matches.length}`);
          }
          const metaSha = matches[0].match(/content="([^"]+)"/)[1];
          if (metaSha.toLowerCase() !== expected) {
            throw new Error(`meta sha mismatch: ${metaSha} != ${expected}`);
          }

          const publicArtifacts = `${raw}\n${indexHtml.match(/<meta\s+name="htp-build-sha"[^>]*>/)?.[0] || ''}`;
          for (const forbidden of ['STRIPE_SECRET_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'postgresql://']) {
            if (publicArtifacts.includes(forbidden)) throw new Error(`forbidden marker: ${forbidden}`);
          }

          console.log(`version proof OK; sha=${parsed.sha} builtAt=${parsed.builtAt}`);
          NODE

      - name: Install Playwright Chromium (with system dependencies)
        run: bunx playwright install --with-deps chromium

      - name: Run recruiter-billing Playwright + Axe suite
        id: recruiter_billing_e2e
        continue-on-error: true
        env:
          HTP_BUILD_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          bunx playwright test --config=playwright.recruiter-billing.config.ts --reporter=list 2>&1 | tee recruiter-billing-e2e.log

      - name: Upload recruiter-billing E2E log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-billing-e2e-log
          path: recruiter-billing-e2e.log
          if-no-files-found: error

      - name: Upload recruiter-billing Playwright + Axe HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-billing-playwright-report
          path: playwright-report-recruiter-billing/
          if-no-files-found: warn

      - name: Upload recruiter-billing responsive screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruiter-billing-test-results
          path: test-results/recruiter-billing/
          if-no-files-found: warn

      - name: Enforce recruiter-billing E2E suite result
        if: steps.recruiter_billing_e2e.outcome != 'success'
        run: exit 1
