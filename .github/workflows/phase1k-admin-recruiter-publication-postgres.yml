name: Phase 1K · Admin-Recruiter Publication · Postgres 16 Gate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migration-candidates/20260720233000_phase1k_admin_recruiter_opportunity_publication.sql'
      - 'src/test/phase1fRecruiterPostingRuntime.test.ts'
      - 'tests/postgres/phase1kAdminRecruiterOpportunityPublicationPostgres.test.ts'
      - 'vitest.phase1k-admin-recruiter-publication-postgres.config.ts'
      - '.github/workflows/phase1k-admin-recruiter-publication-postgres.yml'
  pull_request:
    paths:
      - 'supabase/migration-candidates/20260720233000_phase1k_admin_recruiter_opportunity_publication.sql'
      - 'src/test/phase1fRecruiterPostingRuntime.test.ts'
      - 'tests/postgres/phase1kAdminRecruiterOpportunityPublicationPostgres.test.ts'
      - 'vitest.phase1k-admin-recruiter-publication-postgres.config.ts'
      - '.github/workflows/phase1k-admin-recruiter-publication-postgres.yml'
  workflow_dispatch:

jobs:
  phase1k-admin-recruiter-publication-postgres:
    name: PG16 admin-recruiter publication gate + PGlite + typechecks + build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1k_a2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d phase1k_a2"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PHASE1K_A2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1k_a2
      # Non-secret, test-only Vite placeholders so frontend modules construct.
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: phase1k-a2-ci-placeholder-key
      VITE_SUPABASE_PROJECT_ID: phase1k-a2-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Verify production migration is byte-identical to tested candidate
        run: |
          set -eu
          CANDIDATE="supabase/migration-candidates/20260720233000_phase1k_admin_recruiter_opportunity_publication.sql"
          PRODUCTION="supabase/migrations/20260721000000_phase1k_admin_recruiter_opportunity_publication.sql"
          EXPECTED="6177605b03635221ceb68e250ec4c654d83b4a02dac7ae03f0f5266654857831"
          test -f "$CANDIDATE"
          test -f "$PRODUCTION"
          cmp -s "$CANDIDATE" "$PRODUCTION"
          CANDIDATE_SHA="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          PRODUCTION_SHA="$(sha256sum "$PRODUCTION" | awk '{print $1}')"
          echo "Candidate SHA-256: $CANDIDATE_SHA"
          echo "Production SHA-256: $PRODUCTION_SHA"
          test "$CANDIDATE_SHA" = "$EXPECTED"
          test "$PRODUCTION_SHA" = "$EXPECTED"

      - name: Hard-fail if PHASE1K_A2_DATABASE_URL is absent
        run: |
          if [ -z "${PHASE1K_A2_DATABASE_URL:-}" ]; then
            echo "PHASE1K_A2_DATABASE_URL is required for the Phase 1K-A2 gate." >&2
            exit 1
          fi
          echo "PHASE1K_A2_DATABASE_URL is set."

      - name: Forbidden marker scan (no .only / .skip / .todo)
        run: |
          set -eu
          FILES=(
            "src/test/phase1fRecruiterPostingRuntime.test.ts"
            "tests/postgres/phase1kAdminRecruiterOpportunityPublicationPostgres.test.ts"
          )
          FORBIDDEN='(it|test|describe)\.(skip|only)\b|\bit\.todo\b|\bxit\b|\bxdescribe\b'
          FAIL=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f" >&2
              FAIL=1
              continue
            fi
            if grep -Enq "$FORBIDDEN" "$f"; then
              echo "FORBIDDEN marker found in $f:" >&2
              grep -En "$FORBIDDEN" "$f" >&2 || true
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Wait for PostgreSQL 16 to accept connections
        run: |
          set -eu
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres -d phase1k_a2 >/dev/null 2>&1; then
              echo "Postgres is ready (attempt $i)."
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time." >&2
          exit 1
        env:
          PGPASSWORD: postgres

      - name: Phase 1K-A1 PGlite focused suite
        run: bunx vitest run src/test/phase1fRecruiterPostingRuntime.test.ts

      - name: Phase 1F eligibility & canonical companion suites
        run: |
          bunx vitest run \
            src/test/phase1fRecruiterEligibility.test.ts \
            src/test/phase1fa22CanonicalEligibility.test.ts \
            src/test/phase1fRecruiterPostingRuntime.test.ts

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Real PostgreSQL 16 admin-recruiter publication gate
        id: pg_gate
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run \
            --config vitest.phase1k-admin-recruiter-publication-postgres.config.ts \
            --reporter verbose \
            2>&1 | tee artifacts/phase1k-admin-recruiter-publication-postgres.log
          echo "gate_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload real-Postgres gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1k-admin-recruiter-publication-postgres-log
          path: artifacts/phase1k-admin-recruiter-publication-postgres.log

      - name: Full default Vitest suite
        id: full_suite
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run \
            2>&1 | tee artifacts/phase1k-full-suite.log
          echo "gate_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload full-suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1k-full-suite-log
          path: artifacts/phase1k-full-suite.log

      - name: Enforce real-Postgres gate outcome
        run: |
          set -eu
          EXIT="${{ steps.pg_gate.outputs.gate_exit }}"
          echo "PostgreSQL gate exit code: ${EXIT}"
          if [ "${EXIT}" != "0" ]; then
            echo "Phase 1K-A2 real-Postgres 16 gate FAILED." >&2
            exit 1
          fi

      - name: Enforce full-suite outcome
        run: |
          set -eu
          EXIT="${{ steps.full_suite.outputs.gate_exit }}"
          echo "Full-suite gate exit code: ${EXIT}"
          if [ "${EXIT}" != "0" ]; then
            echo "Phase 1K-A2 full-suite FAILED." >&2
            exit 1
          fi

      - name: Typecheck app
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck node
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Production build
        run: bun run build
