name: Phase 1J-D2B-1 · Recruiter Paid Entitlement · Postgres 16 Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  phase1j-d2b1-recruiter-entitlement-postgres:
    name: PG16 gate + PGlite + typechecks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1j_d2b1
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d phase1j_d2b1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PHASE1J_D2B1_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1j_d2b1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Hard-fail if PHASE1J_D2B1_DATABASE_URL is absent
        run: |
          if [ -z "${PHASE1J_D2B1_DATABASE_URL:-}" ]; then
            echo "PHASE1J_D2B1_DATABASE_URL is required for the Phase 1J-D2B-1 gate." >&2
            exit 1
          fi
          echo "PHASE1J_D2B1_DATABASE_URL is set."

      - name: Forbidden marker scan (no skip / no it.skip / no describe.skip / no .only)
        run: |
          set -eu
          FILES=(
            "src/test/phase1jD2B1RecruiterPaidEntitlementResolver.test.ts"
            "tests/postgres/phase1jD2B1RecruiterPaidEntitlementPostgres.test.ts"
          )
          FORBIDDEN='(it|test|describe)\.(skip|only)\b|\bit\.todo\b|\bxit\b|\bxdescribe\b'
          FAIL=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f" >&2
              FAIL=1
              continue
            fi
            if grep -Enq "$FORBIDDEN" "$f"; then
              echo "FORBIDDEN marker found in $f:" >&2
              grep -En "$FORBIDDEN" "$f" >&2 || true
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Wait for PostgreSQL 16 to accept connections
        run: |
          set -eu
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres -d phase1j_d2b1 >/dev/null 2>&1; then
              echo "Postgres is ready (attempt $i)."
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time." >&2
          exit 1
        env:
          PGPASSWORD: postgres

      - name: PGlite behavioral suite (Phase 1J-D2B-1)
        run: bunx vitest run src/test/phase1jD2B1RecruiterPaidEntitlementResolver.test.ts

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Real PostgreSQL 16 gate (dedicated config, verbose log)
        id: pg_gate
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run \
            --config vitest.phase1j-d2b1-recruiter-entitlement-postgres.config.ts \
            --reporter verbose \
            2>&1 | tee artifacts/phase1j-d2b1-recruiter-entitlement-postgres.log
          echo "gate_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Postgres gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1j-d2b1-recruiter-entitlement-postgres-log
          path: artifacts/phase1j-d2b1-recruiter-entitlement-postgres.log

      - name: Enforce Postgres gate outcome
        run: |
          set -eu
          EXIT="${{ steps.pg_gate.outputs.gate_exit }}"
          echo "Postgres gate exit code: ${EXIT}"
          if [ "${EXIT}" != "0" ]; then
            echo "Phase 1J-D2B-1 Postgres gate FAILED." >&2
            exit 1
          fi

      - name: Phase 1J-A additive capabilities PGlite regression
        run: bunx vitest run src/test/phase1jAdditiveCapabilities.test.ts

      - name: Typecheck (app)
        run: bunx tsgo -p tsconfig.app.json --noEmit

      - name: Typecheck (node)
        run: bunx tsgo -p tsconfig.node.json --noEmit
