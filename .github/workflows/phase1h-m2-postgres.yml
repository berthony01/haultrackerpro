# Temporary verification-only workflow for Phase 1J-C2. Do not merge.
name: Phase 1J-C2 — Recruiter Copy and Assistant Agency Navigation Gate

on:
  pull_request:
    paths:
      - '.github/workflows/phase1h-m2-postgres.yml'
  workflow_dispatch:

jobs:
  phase1j-c2-gate:
    name: Phase 1J-C2 full production gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1h_m2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1h_m2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PHASE1H_M2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1h_m2
      PHASE1H_M2_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Forbidden-marker and misleading-copy scans
        run: |
          set -euo pipefail
          files=(
            src/test/phase1jC2RecruiterCopyReconciliation.test.tsx
            src/test/phase1jC2NavDiscoverability.test.tsx
            src/test/phase1jC2CapabilityLauncherIntact.test.tsx
            src/test/phase1fa22R1aRenderedTrustState.test.tsx
            src/test/phase1eRecruiterOnboardingContinuity.test.ts
            src/test/phase1fRecruiterEligibility.test.ts
            src/test/phase1jB2ARecruiterEntry.test.tsx
            src/test/phase1jB2BDashboardGating.test.tsx
            src/test/phase1jBWorkspaceRouting.test.tsx
            src/test/phase1jAdditiveCapabilities.test.ts
            src/test/phase4aDriverControlCenter.test.ts
            src/test/assistantAgencyAccessIntegrity.test.ts
            src/test/assistantAgencyAccessIntegrityB.test.ts
            src/test/phase3AgencyWorkflow.test.ts
          )
          if grep -nE '\.only\(|\.skip\(|\.todo\(|\b(xit|xdescribe)\b' "${files[@]}"; then
            echo 'Forbidden test marker found'; exit 1
          fi
          if grep -nEi 'Apply for Recruiter Access|Start Application|submit your recruiter profile for review|before approval' \
            src/lib/opportunities/recruiterEligibility.ts \
            src/components/opportunities/recruiter/RecruiterAccessPage.tsx \
            src/components/opportunities/RecruiterOnboarding.tsx \
            src/components/opportunities/recruiter/RecruiterEntryRoute.tsx; then
            echo 'Misleading recruiter copy found'; exit 1
          fi
          echo clean

      - name: Wait for PostgreSQL 16
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo 'postgres ready'; exit 0
            fi
            sleep 1
          done
          echo 'postgres did not become ready'; exit 1

      - name: Run real PostgreSQL 16 M2 regression gate
        id: pg_gate
        run: |
          set -o pipefail
          mkdir -p artifacts
          bunx vitest run --config vitest.phase1h-m2-postgres.config.ts --reporter=verbose 2>&1 | tee artifacts/phase1j-c2-postgres16.log
        continue-on-error: true

      - name: Upload PostgreSQL 16 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1j-c2-postgres16-log
          path: artifacts/phase1j-c2-postgres16.log

      - name: Enforce PostgreSQL 16 result
        if: steps.pg_gate.outcome != 'success'
        run: exit 1

      - name: C2 — recruiter copy supplementary guards
        run: bunx vitest run src/test/phase1jC2RecruiterCopyReconciliation.test.tsx

      - name: C2 — navigation discoverability
        run: bunx vitest run src/test/phase1jC2NavDiscoverability.test.tsx

      - name: C2 — capability launcher intact
        run: bunx vitest run src/test/phase1jC2CapabilityLauncherIntact.test.tsx

      - name: Recruiter real rendered trust and copy matrix
        run: bunx vitest run src/test/phase1fa22R1aRenderedTrustState.test.tsx

      - name: Recruiter onboarding continuity
        run: bunx vitest run src/test/phase1eRecruiterOnboardingContinuity.test.ts

      - name: Recruiter eligibility policy
        run: bunx vitest run src/test/phase1fRecruiterEligibility.test.ts

      - name: Phase 1J recruiter entry
        run: bunx vitest run src/test/phase1jB2ARecruiterEntry.test.tsx

      - name: Phase 1J dashboard gating
        run: bunx vitest run src/test/phase1jB2BDashboardGating.test.tsx

      - name: Phase 1J workspace routing
        run: bunx vitest run src/test/phase1jBWorkspaceRouting.test.tsx

      - name: Phase 1J additive capabilities
        run: bunx vitest run src/test/phase1jAdditiveCapabilities.test.ts

      - name: Phase 4A driver control center
        id: assistant_driver_control
        continue-on-error: true
        run: bunx vitest run src/test/phase4aDriverControlCenter.test.ts --reporter=verbose

      - name: Assistant/Agency access integrity A
        id: assistant_integrity_a
        if: always()
        continue-on-error: true
        run: bunx vitest run src/test/assistantAgencyAccessIntegrity.test.ts --reporter=verbose

      - name: Assistant/Agency access integrity B
        id: assistant_integrity_b
        if: always()
        continue-on-error: true
        run: bunx vitest run src/test/assistantAgencyAccessIntegrityB.test.ts --reporter=verbose

      - name: Phase 3 agency workflow
        id: agency_workflow
        if: always()
        continue-on-error: true
        run: bunx vitest run src/test/phase3AgencyWorkflow.test.ts --reporter=verbose

      - name: Phase 1H-M2 PGlite regression
        id: pglite_m2
        if: always()
        continue-on-error: true
        run: bunx vitest run src/test/phase1hM2OfferWorkflow.test.ts

      - name: Typecheck (node)
        id: typecheck_node
        if: always()
        continue-on-error: true
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Typecheck (app)
        id: typecheck_app
        if: always()
        continue-on-error: true
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Production build
        id: production_build
        if: always()
        continue-on-error: true
        run: bun run build

      - name: Enforce isolated regression and build results
        if: always()
        env:
          DRIVER_CONTROL: ${{ steps.assistant_driver_control.outcome }}
          INTEGRITY_A: ${{ steps.assistant_integrity_a.outcome }}
          INTEGRITY_B: ${{ steps.assistant_integrity_b.outcome }}
          AGENCY_WORKFLOW: ${{ steps.agency_workflow.outcome }}
          PGLITE_M2: ${{ steps.pglite_m2.outcome }}
          TYPECHECK_NODE: ${{ steps.typecheck_node.outcome }}
          TYPECHECK_APP: ${{ steps.typecheck_app.outcome }}
          PRODUCTION_BUILD: ${{ steps.production_build.outcome }}
        run: |
          printf '%s\n' \
            "driver_control=$DRIVER_CONTROL" \
            "integrity_a=$INTEGRITY_A" \
            "integrity_b=$INTEGRITY_B" \
            "agency_workflow=$AGENCY_WORKFLOW" \
            "pglite_m2=$PGLITE_M2" \
            "typecheck_node=$TYPECHECK_NODE" \
            "typecheck_app=$TYPECHECK_APP" \
            "production_build=$PRODUCTION_BUILD"
          test "$DRIVER_CONTROL" = success
          test "$INTEGRITY_A" = success
          test "$INTEGRITY_B" = success
          test "$AGENCY_WORKFLOW" = success
          test "$PGLITE_M2" = success
          test "$TYPECHECK_NODE" = success
          test "$TYPECHECK_APP" = success
          test "$PRODUCTION_BUILD" = success
