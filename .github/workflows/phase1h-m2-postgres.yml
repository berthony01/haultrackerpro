# Temporary verification expansion for Phase 1J-C1. Do not merge this workflow-only PR.
name: Phase 1J-C1 — Full Regression and Postgres 16 Gate

on:
  pull_request:
    paths:
      - '.github/workflows/phase1h-m2-postgres.yml'
      - 'src/components/opportunities/**'
      - 'src/test/phase1jC1*.test.tsx'
      - 'src/test/phase1hA2ApplyNow.test.tsx'
      - 'src/test/phase1hA2OpportunityDetail.test.tsx'
      - 'src/test/phase1jPreviewErrorDiagnostics.test.tsx'
      - 'src/test/phase1jB2BDashboardGating.test.tsx'
      - 'src/test/phase1jB2ARecruiterEntry.test.tsx'
      - 'src/test/phase1jBWorkspaceRouting.test.tsx'
      - 'src/test/phase1jAdditiveCapabilities.test.ts'
      - 'tests/postgres/phase1hM2OfferWorkflowPostgres.test.ts'
      - 'vitest.phase1h-m2-postgres.config.ts'
      - 'supabase/migrations/20260719183725_ee7ffc53-dcdc-4666-bcba-1aeac0f5d0cf.sql'
      - 'supabase/migrations/20260720000000_phase1h_m2_offer_workflow_rpcs.sql'
  workflow_dispatch:

jobs:
  phase1j-c1-full-gate:
    name: Phase 1J-C1 full production gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1h_m2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase1h_m2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PHASE1H_M2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1h_m2
      PHASE1H_M2_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Forbidden-marker scan
        run: |
          files=(
            tests/postgres/phase1hM2OfferWorkflowPostgres.test.ts
            src/test/phase1jC1DriverProfileMutationFailure.test.tsx
            src/test/phase1jC1OpportunityApplyContinuity.test.tsx
            src/test/phase1hA2ApplyNow.test.tsx
            src/test/phase1hA2OpportunityDetail.test.tsx
            src/test/phase1jPreviewErrorDiagnostics.test.tsx
            src/test/phase1jB2BDashboardGating.test.tsx
            src/test/phase1jB2ARecruiterEntry.test.tsx
            src/test/phase1jBWorkspaceRouting.test.tsx
            src/test/phase1jAdditiveCapabilities.test.ts
          )
          if grep -nE '\.(only|skip|todo)\(|\b(xit|xdescribe)\b' "${files[@]}"; then
            echo "Forbidden test marker found."; exit 1
          fi
          echo "clean"

      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready"; exit 1

      - name: Run real PostgreSQL 16 M2 gate
        id: pg_gate
        run: |
          set -o pipefail
          mkdir -p artifacts
          bunx vitest run --config vitest.phase1h-m2-postgres.config.ts --reporter=verbose 2>&1 | tee artifacts/phase1j-c1-postgres.log
        continue-on-error: true

      - name: Upload PostgreSQL 16 gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1j-c1-postgres16-log
          path: artifacts/phase1j-c1-postgres.log

      - name: Enforce PostgreSQL 16 gate result
        if: steps.pg_gate.outcome != 'success'
        run: |
          echo "Real PostgreSQL 16 gate failed. See uploaded log."
          exit 1

      - name: C1 — real DriverOpportunityProfile mutation contract
        run: bunx vitest run src/test/phase1jC1DriverProfileMutationFailure.test.tsx

      - name: C1 — Apply continuity integration
        run: bunx vitest run src/test/phase1jC1OpportunityApplyContinuity.test.tsx

      - name: A2 — Apply Now regression
        run: bunx vitest run src/test/phase1hA2ApplyNow.test.tsx

      - name: A2 — Opportunity detail regression
        run: bunx vitest run src/test/phase1hA2OpportunityDetail.test.tsx

      - name: Preview diagnostic regression
        run: bunx vitest run src/test/phase1jPreviewErrorDiagnostics.test.tsx

      - name: Dashboard capability gating regression
        run: bunx vitest run src/test/phase1jB2BDashboardGating.test.tsx

      - name: Recruiter entry regression
        run: bunx vitest run src/test/phase1jB2ARecruiterEntry.test.tsx

      - name: Workspace routing regression
        run: bunx vitest run src/test/phase1jBWorkspaceRouting.test.tsx

      - name: Additive capability regression
        run: bunx vitest run src/test/phase1jAdditiveCapabilities.test.ts

      - name: Typecheck (node)
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Typecheck (app)
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Production build
        run: bun run build
