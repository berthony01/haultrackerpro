name: Launch candidate Telegram and dispatch isolated QA

on:
  pull_request:
    paths:
      - '.github/workflows/launch-telegram-dispatch-regression.yml'
      - 'docs/launch-readiness-2026-11-12.md'
      - 'index.html'
      - 'src/App.tsx'
      - 'src/pages/Index.tsx'
      - 'src/components/ReportsView.tsx'
      - 'src/components/telegram/**'
      - 'src/components/opportunities/RecruiterOpportunityManager.tsx'
      - 'src/hooks/useTelegramMiniAppConnection.ts'
      - 'src/lib/telegramMiniApp.ts'
      - 'src/lib/authNavigation.ts'
      - 'src/lib/analytics.ts'
      - 'src/pages/TelegramMiniApp.tsx'
      - 'src/styles/telegram-mini-app.css'
      - 'src/styles/dispatch-workspace.css'
      - 'src/components/dispatch/**'
      - 'src/pages/DispatchDashboard.tsx'
      - 'src/pages/DriverCompanyConnections.tsx'
      - 'src/hooks/useCompanyDriverConnections.ts'
      - 'src/hooks/useLoads.ts'
      - 'src/lib/loadEffectiveDate.ts'
      - 'src/test/companyDispatchWorkflow.test.tsx'
      - 'src/test/financialPeriodParity.test.ts'
      - 'src/test/dispatchWorkspace*'
      - 'supabase/migration-candidates/*company_driver_dispatch_workflow.sql'
      - 'src/test/telegramMiniApp*'
      - 'src/test/authenticatedWorkChat.test.tsx'
      - 'vite/htpBuildShaPlugin.ts'
      - 'vite/htpMiniAppPrivacy.ts'
      - 'supabase/functions/telegram-mini-app/**'
      - 'supabase/functions/_shared/telegram-mini-app-*'
      - 'supabase/functions/telegram-poll/index.ts'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://pngptztxwbtozwxrtbwo.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-unit-test-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Typecheck app and build configuration
        run: |
          bunx tsc -p tsconfig.app.json --noEmit
          bunx tsc -p tsconfig.node.json --noEmit
      - name: Verify identity, role gates, posting, chat and dispatch regression
        run: >-
          bunx vitest run
          src/test/telegramMiniApp src/test/phaseRB src/test/phaseTG
          src/test/phaseSprint1TelegramDispatchGuidance.test.ts
          src/test/phaseUX1TelegramBotGuidance.test.ts
          src/test/authNavigation.test.ts
          src/test/authenticatedWorkChat.test.tsx
          src/test/recruiterOpportunityFormConsolidation.test.tsx
          src/test/phaseRC1DRecruiterStaffOpportunityAuthorization.test.tsx
          src/test/phaseRC1ERecruiterStaffApplicationAuthorization.test.tsx
          src/test/phaseRC1CRecruiterStaffWorkspaceResolution.test.tsx
          src/test/phaseCF1BConversationUi.test.tsx
          src/test/companyDispatchWorkflow.test.tsx
          src/test/dispatchWorkspace.test.ts
          src/test/dispatchWorkspaceHook.test.tsx
          src/test/dispatchWorkspaceComponent.test.tsx
          src/test/dispatchWorkspaceGroupEntry.test.ts
          --exclude '**/*LocalPostgres*'
      - name: Verify the shared Dispatch lifecycle and concurrent requests in PostgreSQL
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/postgres ]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y postgresql-16
          fi
          HTP_TEST_POSTGRES_BINDIR=/usr/lib/postgresql/16/bin bunx vitest run --maxWorkers=1 src/test/dispatchWorkspacePostgres.test.ts
      - name: Verify reporting and weekly CSV dates in Central time
        run: TZ=America/Chicago bunx vitest run src/test/financialPeriodParity.test.ts
      - name: Lint Mini App production screens
        run: >-
          bunx eslint src/components/telegram src/hooks/useTelegramMiniAppConnection.ts
          src/lib/telegramMiniApp.ts src/pages/TelegramMiniApp.tsx
      - name: Build production frontend with public deployment defaults
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
        run: bun run build
