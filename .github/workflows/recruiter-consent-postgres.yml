name: Recruiter Consent — Postgres 16 Concurrency Gate

on:
  push:
    paths:
      - '.github/workflows/recruiter-consent-postgres.yml'
      - 'tests/postgres/**'
      - 'vitest.postgres.config.ts'
      - 'supabase/migrations/20260717223452_ff4257ea-d71a-4cca-881b-3f5ab5d7011a.sql'
      - 'supabase/migrations/20260717213626_3ad0fe69-da04-413d-837d-25f43bb53fdd.sql'
      - 'package.json'
      - 'bun.lockb'
  pull_request:
    paths:
      - '.github/workflows/recruiter-consent-postgres.yml'
      - 'tests/postgres/**'
      - 'vitest.postgres.config.ts'
      - 'supabase/migrations/20260717223452_ff4257ea-d71a-4cca-881b-3f5ab5d7011a.sql'
      - 'supabase/migrations/20260717213626_3ad0fe69-da04-413d-837d-25f43bb53fdd.sql'
      - 'package.json'
      - 'bun.lockb'
  workflow_dispatch:

jobs:
  recruiter-consent-postgres:
    name: Real Postgres 16 — accept_recruiter_posting_terms
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r1b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r1b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/r1b
      R1B_REQUIRE_POSTGRES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run R1B real-Postgres concurrency + consent-pair test
        run: bun run test:postgres-consent
