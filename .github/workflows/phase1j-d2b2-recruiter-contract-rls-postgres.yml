name: Phase 1J-D2B-2 · Recruiter Contract RLS · Postgres 16 Gate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migration-candidates/20260720203000_phase1j_d2b1_recruiter_paid_entitlement_resolver.sql'
      - 'supabase/migration-candidates/20260720214500_phase1j_d2b2_recruiter_contract_workflow_rls.sql'
      - 'src/test/phase1jD2B2RecruiterContractWorkflowRls.test.ts'
      - 'tests/postgres/phase1jD2B2RecruiterContractWorkflowRlsPostgres.test.ts'
      - 'vitest.phase1j-d2b2-recruiter-contract-rls-postgres.config.ts'
      - '.github/workflows/phase1j-d2b2-recruiter-contract-rls-postgres.yml'
  pull_request:
    paths:
      - 'supabase/migration-candidates/20260720203000_phase1j_d2b1_recruiter_paid_entitlement_resolver.sql'
      - 'supabase/migration-candidates/20260720214500_phase1j_d2b2_recruiter_contract_workflow_rls.sql'
      - 'src/test/phase1jD2B2RecruiterContractWorkflowRls.test.ts'
      - 'tests/postgres/phase1jD2B2RecruiterContractWorkflowRlsPostgres.test.ts'
      - 'vitest.phase1j-d2b2-recruiter-contract-rls-postgres.config.ts'
      - '.github/workflows/phase1j-d2b2-recruiter-contract-rls-postgres.yml'
  workflow_dispatch:

jobs:
  phase1j-d2b2-recruiter-contract-rls-postgres:
    name: PG16 runtime matrix + PGlite + typechecks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phase1j_d2b2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d phase1j_d2b2"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PHASE1J_D2B2_DATABASE_URL: postgres://postgres:postgres@localhost:5432/phase1j_d2b2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Hard-fail if PHASE1J_D2B2_DATABASE_URL is absent
        run: |
          if [ -z "${PHASE1J_D2B2_DATABASE_URL:-}" ]; then
            echo "PHASE1J_D2B2_DATABASE_URL is required for the Phase 1J-D2B-2 gate." >&2
            exit 1
          fi
          echo "PHASE1J_D2B2_DATABASE_URL is set."

      - name: Forbidden marker scan
        run: |
          set -eu
          FILES=(
            "src/test/phase1jD2B2RecruiterContractWorkflowRls.test.ts"
            "tests/postgres/phase1jD2B2RecruiterContractWorkflowRlsPostgres.test.ts"
          )
          FORBIDDEN='(it|test|describe)\.(skip|only)\b|\bit\.todo\b|\bxit\b|\bxdescribe\b'
          FAIL=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING required file: $f" >&2
              FAIL=1
              continue
            fi
            if grep -Enq "$FORBIDDEN" "$f"; then
              echo "FORBIDDEN marker found in $f:" >&2
              grep -En "$FORBIDDEN" "$f" >&2 || true
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Wait for PostgreSQL 16 to accept connections
        run: |
          set -eu
          for i in $(seq 1 60); do
            if pg_isready -h localhost -p 5432 -U postgres -d phase1j_d2b2 >/dev/null 2>&1; then
              echo "Postgres is ready (attempt $i)."
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time." >&2
          exit 1
        env:
          PGPASSWORD: postgres

      - name: D2B-1 resolver dependency regression
        run: bunx vitest run src/test/phase1jD2B1RecruiterPaidEntitlementResolver.test.ts

      - name: D2B-2 PGlite source and catalog contract
        run: bunx vitest run src/test/phase1jD2B2RecruiterContractWorkflowRls.test.ts

      - name: Trial-language guard
        run: bunx vitest run src/test/noTrialLanguage.test.ts

      - name: Full default Vitest suite
        run: bunx vitest run

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Real PostgreSQL 16 contract RLS gate
        id: pg_gate
        continue-on-error: true
        run: |
          set -o pipefail
          bunx vitest run \
            --config vitest.phase1j-d2b2-recruiter-contract-rls-postgres.config.ts \
            --reporter verbose \
            2>&1 | tee artifacts/phase1j-d2b2-recruiter-contract-rls-postgres.log
          echo "gate_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload PostgreSQL gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1j-d2b2-recruiter-contract-rls-postgres-log
          path: artifacts/phase1j-d2b2-recruiter-contract-rls-postgres.log

      - name: Enforce PostgreSQL gate outcome
        run: |
          set -eu
          EXIT="${{ steps.pg_gate.outputs.gate_exit }}"
          echo "PostgreSQL gate exit code: ${EXIT}"
          if [ "${EXIT}" != "0" ]; then
            echo "Phase 1J-D2B-2 PostgreSQL gate FAILED." >&2
            exit 1
          fi

      - name: Typecheck app
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Typecheck node
        run: bunx tsc -p tsconfig.node.json --noEmit

      - name: Production build
        run: bun run build

# CI verification trigger: Phase 1J-D2B-2 PostgreSQL 16 PR gate.
